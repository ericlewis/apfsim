name: interact_boot
data_slots: []
inputs:
  - frame: 1
    player: 1
    button: A
    hold_frames: 2
  - frame: 2
    player: 1
    button: Right
    hold_frames: 2
run:
  until_frames: 4
  timeout_cycles: 20000000
expect:
  status: running
  video:
    active_width: 320
    active_height: 288
    min_frames: 2
    max_errors: 0
    require_rgb_zero_when_de_low: true
    require_single_cycle_sync: true
    require_skip_only_during_de: true
    min_hs_after_vs_cycles: 3
    min_hs_to_de_gap_cycles: 1
    min_de_to_hs_gap_cycles: 1
    min_unique_colors: 1
  audio:
    min_samples: 64
    expected_mclk_lrck_ratio: 256
    max_mclk_lrck_ratio_error: 2
  input:
    require_scripted_activity: true
  interact:
    min_persistent_writes: 1
  reset:
    require_reset_enter: true
    require_reset_exit: true
    require_ready_to_run: true
