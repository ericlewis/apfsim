name: mrjong_boot_real_frames
data_slots:
  - id: 1
    name: ROM
    file: /Users/ericlewis/Developer/openfpga-arcade-cores/our-pocket-cores/openFPGA-MrJong/dist/Assets/Mr. Jong.rom
    address: 0x10000000
    required: true
interact:
  writes:
    - frame: boot
      address: 0x50000014
      value: 1
inputs:
  - frame: 2
    player: 1
    button: Select
    hold_frames: 4
  - frame: 6
    player: 1
    button: Start
    hold_frames: 4
run:
  until_frames: 12
  timeout_cycles: 30000000
expect:
  status: running
  video:
    active_width: 240
    active_height: 224
    min_frames: 6
    max_errors: 0
    require_rgb_zero_when_de_low: true
    require_single_cycle_sync: true
    require_skip_only_during_de: true
  audio:
    min_samples: 128
  data:
    require_required_slots: true
    require_all_file_slots_loaded: true
    expected_total_loaded_bytes: 41248
  reset:
    require_reset_enter: true
    require_reset_exit: true
    require_ready_to_run: true
  interact:
    min_persistent_writes: 1
